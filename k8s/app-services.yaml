apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-data
  namespace: jobflow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: jobflow
  labels:
    app: backend
    app.kubernetes.io/part-of: jobflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: jobflow-backend:v2.0.0-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: UPLOAD_DIRECTORY
              value: /app/uploads
          volumeMounts:
            - name: uploads-data
              mountPath: /app/uploads
            - name: db-credentials
              mountPath: /run/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data
        - name: db-credentials
          secret:
            secretName: db-credentials
            items:
              - key: db_password
                path: db_password
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jobflow
  labels:
    app.kubernetes.io/part-of: jobflow
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: jobflow
  labels:
    app: worker
    app.kubernetes.io/part-of: jobflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: jobflow-worker:v2.0.0-dev
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: UPLOAD_DIRECTORY
              value: /app/uploads
          volumeMounts:
            - name: uploads-data
              mountPath: /app/uploads
            - name: db-credentials
              mountPath: /run/secrets
              readOnly: true
          startupProbe:
            exec:
              command: ["python", "-c", "import redis, os; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          readinessProbe:
            exec:
              command: ["python", "-c", "import redis, os; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["python", "-c", "import redis, os; redis.Redis.from_url(os.environ['REDIS_URL']).ping()"]
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 512Mi
      volumes:
        - name: uploads-data
          persistentVolumeClaim:
            claimName: uploads-data
        - name: db-credentials
          secret:
            secretName: db-credentials
            items:
              - key: db_password
                path: db_password
